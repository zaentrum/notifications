apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notifications
  namespace: stube-beta
  labels:
    app: notifications
    stube.value-stream: stube
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: notifications
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
